<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - CampusArena | KU Sports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="bg-light">
    <!-- AUTH CONTAINER SECTION START -->
    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-5">
                <!-- Back to Home Link -->
                <div class="mb-4 text-center text-md-start">
                    <a href="index.html" class="text-decoration-none text-success fw-bold small">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to CampusArena
                    </a>
                </div>

                <!-- Card Container -->
                <div class="login-card p-4 p-md-5 rounded-4 shadow-sm bg-white">

                    <!-- Toggle Tabs to switch between Login and Sign Up -->
                    <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill custom-auth-tabs" id="authTab"
                        role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-pill py-2 fw-bold small text-dark" id="login-tab"
                                data-bs-toggle="pill" data-bs-target="#login-content" type="button" role="tab"
                                aria-controls="login-content" aria-selected="true">Login</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill py-2 fw-bold small text-dark" id="signup-tab"
                                data-bs-toggle="pill" data-bs-target="#signup-content" type="button" role="tab"
                                aria-controls="signup-content" aria-selected="false">Sign Up</button>
                        </li>
                    </ul>

                    <!-- Tab Content Container -->
                    <div class="tab-content" id="authTabContent">

                        <!-- LOGIN FORM SECTION -->
                        <div class="tab-pane fade show active" id="login-content" role="tabpanel"
                            aria-labelledby="login-tab">
                            <div class="text-center mb-4">
                                <div class="login-icon-box bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                                    style="width: 60px; height: 60px;">
                                    <i class="fa-solid fa-graduation-cap fa-lg"></i>
                                </div>
                                <h3 class="fw-black login-title-dark mb-1">
                                    Welcome Back</h3>
                                <p class="text-muted small">Login to your CampusArena account</p>
                            </div>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-muted">University Email

                                    </label>
                                    <input type="email" class="form-control rounded-pill px-3 py-2"
                                        placeholder="student@uok.edu.pk" required>
                                </div>
                                <div class="mb-4">
                                    <div class="d-flex justify-content-between align-items-center"><label
                                            class="form-label small fw-semibold text-muted mb-0">Password</label>

                                    </div>
                                    <input type="password" class="form-control rounded-pill px-3 py-2 mt-1"
                                        placeholder="••••••••" required>
                                </div>
                                <button type="submit"
                                    class="btn btn-success rounded-pill w-100 py-3 fw-bold shadow-sm mb-3">Login to
                                    Portal</button>
                            </form>
                            <p class="text-center small text-muted mb-0 mt-3">
                                Don't have an account? <a href="#signup-content" id="switchToSignup"
                                    class="text-success fw-bold text-decoration-none">Sign Up</a>
                            </p>
                        </div>

                        <!-- SIGN UP FORM SECTION -->
                        <div class="tab-pane fade" id="signup-content" role="tabpanel" aria-labelledby="signup-tab">
                            <div class="text-center mb-4">
                                <div class="login-icon-box bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                                    style="width: 60px; height: 60px;">
                                    <i class="fa-solid fa-user-plus fa-lg"></i>
                                </div>
                                <h3 class="fw-black login-title-dark mb-1">Create Account</h3>
                                <p class="text-muted small">Join Karachi University sports portal</p>
                            </div>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-muted">Full Name</label>
                                    <input type="text" class="form-control 
            rounded-pill px-3 py-2" placeholder="Student" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-muted">University Email</label>
                                    <input type="email" class="form-control rounded-pill px-3 py-2"
                                        placeholder="student@uok.edu.pk" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-semibold text-muted">Create Password</label>
                                    <input type="password" class="form-control rounded-pill px-3 py-2"
                                        placeholder="••••••••" required>
                                </div>
                                <button type="submit"
                                    class="btn btn-success rounded-pill w-100 py-3 fw-bold shadow-sm mb-3">Sign
                                    Up</button>
                            </form>
                            <p class="text-center small text-muted mb-0 mt-3">
                                Already have an account? <a href="#login-content" id="switchToLogin"
                                    class="text-success fw-bold text-decoration-none">Login</a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- AUTH CONTAINER SECTION END -->

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
    <script src="script.js"></script>
</body>

</html>
